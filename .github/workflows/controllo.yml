# Il controllo a ogni invio, su Linux: i tipi delle tre configurazioni di `tsc`, le prove di `bun test` e i casi d'uso
# del corpus. A ogni invio, su ogni ramo e anche su `master`, corre la parte veloce (tipi e casi, circa un minuto); le
# prove intere (circa 13 minuti) solo quando il controllo si lancia a mano con «prove» acceso: fino a quando il
# repository è privato i minuti delle Actions sono contati, e le prove intere corrono nel collaudo sul PC di sviluppo.
# Ogni passo corre anche se uno prima è rosso, così un esito rosso li mostra tutti.
#
# Che cosa NON guarda: la build dell'app e del guscio (`bun run build`, `bun tauri build`), le prove dell'interfaccia
# nei motori (Playwright), le prove del guscio in Rust (`cargo test`), il test differenziale col compilatore C, Windows
# e macOS. Queste corrono nelle build di release o sul PC di sviluppo.
name: controllo

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      prove:
        description: "Esegui anche le prove di bun test (circa 20 minuti)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  BUN_VERSION: "bun-v1.4.2"

jobs:
  controllo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Bun
        working-directory: .
        run: |
          curl -fsSL https://bun.sh/install | bash -s "$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Dipendenze
        run: bun install --frozen-lockfile

      - name: Tipi del nucleo
        if: ${{ !cancelled() }}
        run: ./node_modules/.bin/tsc -p tsconfig.nucleo.json --noEmit

      - name: Tipi dell'interfaccia
        if: ${{ !cancelled() }}
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit

      - name: Tipi degli strumenti
        if: ${{ !cancelled() }}
        run: ./node_modules/.bin/tsc -p tsconfig.strumenti.json --noEmit

      - name: Prove (bun test)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.prove }}
        run: bun test

      - name: Casi d'uso del corpus
        if: ${{ !cancelled() }}
        run: bun run casi
