# La build di release, lanciata a mano, per le piattaforme scelte (Windows, Linux e macOS). Il job di Windows compone il
# pacchetto portabile con `bun run pacchetto` (lo zip, la sua impronta e i controlli dello strumento: l'albero, le
# proprietà dell'eseguibile, nessun percorso della macchina nei byte, le voci dell'elenco, le licenze, la doppia lettura
# dello zip); quello di Linux compone l'archivio con `strumenti/archivio.ts` (l'AppImage su Ubuntu 22.04, la glibc più
# vecchia fra le immagini, gli stessi controlli più le librerie di Ubuntu dentro l'AppImage coi loro copyright, e
# l'archivio dello strumento a riga di comando, provato estratto). Ognuno estrae il suo archivio in una cartella con
# spazi, avvia il programma una volta (resta vivo per 20 s, fotografia dello schermo) e carica gli artefatti. Non pubblica nulla: la release si crea a parte dagli artefatti scaricati. Gli artefatti
# durano 7 giorni: lo spazio incluso è poco, e la copia che dura è la release.
#
# Con «prove» acceso (una volta per release) corrono anche, sull'archivio di Linux della stessa corsa o sul sorgente:
# - le prove dell'interfaccia nel WebKit di Playwright per Linux (il progetto `webkit-anteprima`, `strumenti/webkit.ts`),
#   con un processo solo, la misura del canvas più grande di quel motore (`strumenti/misura-del-canvas.ts`) e le righe
#   della barra in Chromium per Linux (`e2e/barra.e2e.ts`);
# - la prova sul prodotto dell'AppImage col WebKitGTK di Ubuntu 22.04 (`strumenti/linux/prova-ci.ts`): lingua,
#   esecuzione, vettore di 1000 elementi, suggerimento fotografato, memoria, tracce fuori da `data/`; e le due misure del
#   motore, il canvas e la stampa (`window.print()` fotografata);
# - il test differenziale col gcc e il clang di Ubuntu 24.04 (`bun run differenziale`, con gli avvisi attesi), due volte:
#   col Python del servizio e col Python 3.11, la versione più vecchia per cui il codice generato è dichiarato.
#
# Il job del Mac compone con lo stesso `archivio.ts` l'app universale firmata ad hoc e lo strumento a riga di comando; avvia
# l'app estratta nelle due architetture (Intel attraverso Rosetta), prova l'uscita e i menu coi tasti veri
# (`strumenti/mac/prova-uscita.sh`, 16 casi confrontati da `esiti-dell-uscita.ts`, con un esito alterato che deve dire rosso)
# e misura la stampa. Con «prove» acceso corrono anche `cargo test` su APFS e `bun test` sul Mac e, se non è spento
# «webkit_del_mac», le prove dell'interfaccia nel WebKit di Playwright per il Mac con la misura del canvas.
#
# Da un'etichetta `v<versione>` il pacchetto è una release; da un ramo è un pacchetto di prova (`--prova`), con lo
# stesso contenuto e lo stesso nome, nella cartella `dist/prova/` del runner.
#
# Fino a quando il repository è privato il calcolo e lo spazio delle Actions sono contati: ogni corsa si chiede, col
# consumo del mese guardato prima; il pacchetto per Windows si compone anche sul PC con lo stesso strumento (`bun run
# pacchetto`).
#
# Che cosa NON guarda: che il programma per Windows faccia ciò che deve oltre ad aprirsi e restare vivo (lo provano le
# clausole della prova sul prodotto, sul pacchetto scaricato, e il controllo a ogni invio); che la finestra disegni
# qualcosa (le fotografie si guardano); la firma dei programmi (non sono firmati); l'AppImage avviata con FUSE su una
# macchina pulita (lo fa `verifica.yml`, dalla release); un desktop Linux vero; sul Mac, Gatekeeper all'apertura di un file
# scaricato, una firma di Apple (non c'è), un Mac vero con processore Intel, la finestra oltre ciò che le fotografie mostrano.
name: release

on:
  workflow_dispatch:
    inputs:
      piattaforme:
        description: "Piattaforme da costruire, separate da virgole (windows, linux, macos)"
        default: "windows"
      prove:
        description: "Anche le prove di Linux (WebKit, prodotto, differenziale) e del Mac (cargo test, bun test, WebKit), una volta per release"
        type: boolean
        default: false
      webkit_del_mac:
        description: "Con «prove» e macos, anche il WebKit del Mac (si spegne per le corse di prova del job)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.0"
  BUN_VERSION: "1.4.2"

jobs:
  windows:
    if: contains(inputs.piattaforme || 'windows', 'windows')
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Rust e Bun
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          # In un processo a parte: l'installatore di Bun riscrive il PATH della sessione, e Rust non si troverebbe più.
          pwsh -NoProfile -Command "& ([scriptblock]::Create((Invoke-RestMethod https://bun.sh/install.ps1))) -Version $env:BUN_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$HOME\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          rustc --version

      - name: Dipendenze
        working-directory: app
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Pacchetto
        working-directory: app
        run: |
          bun run pacchetto --testi ../rilascio/windows ${{ github.ref_type != 'tag' && '--prova' || '' }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Raccolta
        run: |
          New-Item -ItemType Directory -Force uscita | Out-Null
          $cartella = if ("${{ github.ref_type }}" -eq "tag") { "dist" } else { "dist/prova" }
          # I tre pacchetti, ognuno atteso per nome dalla versione: uno che manca è rosso e si nomina.
          $versione = (Get-Content -Raw app/package.json | ConvertFrom-Json).version
          $attesi = @("AlgoDesign-$versione-windows-x64.zip", "AlgoDesign-Tools-$versione-windows.zip", "AlgoDesign-Core-$versione.zip")
          $mancanti = @($attesi | ForEach-Object { $_; "$_.sha256" } | Where-Object { -not (Test-Path -LiteralPath (Join-Path $cartella $_)) })
          if ($mancanti.Count -gt 0) { "ROSSO: in ${cartella} mancano: $($mancanti -join ', ')"; exit 1 }
          foreach ($nome in $attesi) { Copy-Item -LiteralPath (Join-Path $cartella $nome), (Join-Path $cartella "$nome.sha256") -Destination uscita/ }
          "raccolti: $($attesi -join ', ')"
          Copy-Item app/.collaudo/pacchetto-*.log uscita/
          # Il commit da cui nasce il pacchetto, con il ramo o l'etichetta e la corsa.
          "commit $(git rev-parse HEAD)`nref ${{ github.ref }}`ncorsa ${{ github.run_id }}" | Out-File -FilePath uscita/commit.txt -Encoding utf8
          Get-Content uscita/commit.txt

      - name: Avvio di prova
        run: |
          $zip = Get-ChildItem uscita/AlgoDesign-*-windows-x64.zip
          $dove = Join-Path $env:RUNNER_TEMP "prova con spazi"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dove
          $exe = Get-ChildItem "$dove/*/AlgoDesign.exe"
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 20
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("uscita/schermo-windows.png")
          } catch { "fotografia dello schermo non riuscita: $_" }
          $p.Refresh()
          "finestra: «$($p.MainWindowTitle)»"
          "contenuto di data/:"; Get-ChildItem -Recurse -Force (Join-Path $exe.DirectoryName "data") | ForEach-Object { $_.FullName }
          if ($p.HasExited) { "ROSSO: il programma non è più vivo dopo 20 s (exit $($p.ExitCode))"; exit 1 }
          "VERDE: il programma è vivo dopo 20 s"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: uscita/
          if-no-files-found: error
          retention-days: 7

  linux:
    if: contains(inputs.piattaforme || 'windows', 'linux')
    # La glibc più vecchia fra le immagini disponibili: l'AppImage parte solo dove la glibc è uguale o più nuova.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev file xvfb imagemagick

      - name: Rust e Bun
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Dipendenze
        working-directory: app
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Archivio
        working-directory: app
        run: bun ./strumenti/archivio.ts --piattaforma linux --testi ../rilascio/linux ${{ github.ref_type != 'tag' && '--prova' || '' }}

      - name: Raccolta
        run: |
          mkdir -p uscita
          if [ "${{ github.ref_type }}" = "tag" ]; then cartella=dist; else cartella=dist/prova; fi
          # I due archivi, ognuno atteso per nome dalla versione: uno che manca è rosso e si nomina.
          versione=$(jq -r .version app/package.json)
          mancanti=""
          for nome in "AlgoDesign-${versione}-linux-x64.tar.gz" "AlgoDesign-Tools-${versione}-linux-x64.tar.gz"; do
            for f in "${nome}" "${nome}.sha256"; do test -f "${cartella}/${f}" || mancanti="${mancanti} ${f}"; done
            test -f "${cartella}/${nome}" && cp "${cartella}/${nome}" "${cartella}/${nome}.sha256" uscita/
          done
          if [ -n "${mancanti}" ]; then echo "ROSSO: in ${cartella} mancano:${mancanti}"; exit 1; fi
          echo "raccolti: $(ls uscita | tr '\n' ' ')"
          cp app/.collaudo/archivio-*.log uscita/
          # Il commit da cui nasce l'archivio, con il ramo o l'etichetta e la corsa.
          printf 'commit %s\nref %s\ncorsa %s\n' "$(git rev-parse HEAD)" "${{ github.ref }}" "${{ github.run_id }}" > uscita/commit.txt
          cat uscita/commit.txt

      - name: Avvio di prova
        run: |
          dove="${RUNNER_TEMP}/prova con spazi"
          mkdir -p "${dove}"
          versione=$(jq -r .version app/package.json)
          tar -xzf "uscita/AlgoDesign-${versione}-linux-x64.tar.gz" -C "${dove}"
          cd "${dove}/AlgoDesign-${versione}/"
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          # Senza FUSE l'AppImage si estrae e parte da lì; l'avvio con FUSE lo prova `verifica.yml`.
          DISPLAY=:99 APPIMAGE_EXTRACT_AND_RUN=1 ./AlgoDesign.AppImage > "${GITHUB_WORKSPACE}/uscita/avvio-linux.log" 2>&1 &
          pid=$!
          sleep 20
          import -display :99 -window root "${GITHUB_WORKSPACE}/uscita/schermo-linux.png" || echo "fotografia dello schermo non riuscita"
          echo "contenuto di data/:"; find data | sort
          kill -0 "${pid}" || { echo "ROSSO: il programma non è più vivo dopo 20 s"; cat "${GITHUB_WORKSPACE}/uscita/avvio-linux.log"; exit 1; }
          echo "VERDE: il programma è vivo dopo 20 s"
          kill "${pid}"

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: uscita/
          if-no-files-found: error
          retention-days: 7

  macos:
    if: contains(inputs.piattaforme || 'windows', 'macos')
    # Mac con chip Apple; l'app contiene anche la versione Intel, avviata con Rosetta.
    runs-on: macos-15
    # Una domanda del sistema che nessuno chiude non tiene il job per ore.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Rust e Bun
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Dipendenze
        working-directory: app
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Archivio
        working-directory: app
        run: bun ./strumenti/archivio.ts --piattaforma macos --testi ../rilascio/macos ${{ github.ref_type != 'tag' && '--prova' || '' }}

      - name: Raccolta
        run: |
          mkdir -p uscita
          if [ "${{ github.ref_type }}" = "tag" ]; then cartella=dist; else cartella=dist/prova; fi
          # I due archivi, ognuno atteso per nome dalla versione: uno che manca è rosso e si nomina.
          versione=$(jq -r .version app/package.json)
          mancanti=""
          for nome in "AlgoDesign-${versione}-macos-universal.zip" "AlgoDesign-Tools-${versione}-macos-universal.zip"; do
            for f in "${nome}" "${nome}.sha256"; do test -f "${cartella}/${f}" || mancanti="${mancanti} ${f}"; done
            test -f "${cartella}/${nome}" && cp "${cartella}/${nome}" "${cartella}/${nome}.sha256" uscita/
          done
          if [ -n "${mancanti}" ]; then echo "ROSSO: in ${cartella} mancano:${mancanti}"; exit 1; fi
          echo "raccolti: $(ls uscita | tr '\n' ' ')"
          cp app/.collaudo/archivio-*.log uscita/
          sw_vers > uscita/macos-del-runner.txt
          # Il commit da cui nasce l'archivio, con il ramo o l'etichetta e la corsa.
          printf 'commit %s\nref %s\ncorsa %s\n' "$(git rev-parse HEAD)" "${{ github.ref }}" "${{ github.run_id }}" > uscita/commit.txt
          cat uscita/commit.txt

      - name: Avvio di prova (chip Apple, poi Intel con Rosetta)
        run: |
          dove="${RUNNER_TEMP}/prova con spazi"
          mkdir -p "${dove}"
          versione=$(jq -r .version app/package.json)
          ditto -x -k "uscita/AlgoDesign-${versione}-macos-universal.zip" "${dove}"
          app="${dove}/AlgoDesign-${versione}/AlgoDesign.app"
          echo "APP_DI_PROVA=${app}" >> "$GITHUB_ENV"
          for arch in arm64 x86_64; do
            arch -"${arch}" "${app}/Contents/MacOS/algodesign" > "uscita/avvio-macos-${arch}.log" 2>&1 &
            pid=$!
            sleep 20
            screencapture -x "uscita/schermo-macos-${arch}.png" || echo "fotografia dello schermo non riuscita"
            kill -0 "${pid}" || { echo "ROSSO (${arch}): il programma non è più vivo dopo 20 s"; cat "uscita/avvio-macos-${arch}.log"; exit 1; }
            echo "VERDE (${arch}): il programma è vivo dopo 20 s"
            kill "${pid}"
            sleep 3
          done
          # Dove l'app ha scritto fuori dalla sua cartella: le voci della Libreria col suo identificatore.
          { find "$HOME/Library" -maxdepth 4 -iname '*algodesign*' 2>/dev/null || true; } | sort | tee uscita/voci-nella-libreria.txt
          echo "voci: $(wc -l < uscita/voci-nella-libreria.txt)"

      - name: Prova dell'uscita e dei menu
        run: |
          bash app/strumenti/mac/prova-uscita.sh "${APP_DI_PROVA}" "$PWD/uscita/uscita-mac"
          cd app
          bun ./strumenti/mac/esiti-dell-uscita.ts ../uscita/uscita-mac/esiti.txt
          # Il controllo positivo: lo stesso confronto, con un esito alterato, deve dire rosso. La riga toccata si conta.
          sed 's/^cmdq: viva/cmdq: morta/' ../uscita/uscita-mac/esiti.txt > ../uscita/uscita-mac/esiti-alterati.txt
          echo "righe alterate: $(grep -c '^cmdq: morta' ../uscita/uscita-mac/esiti-alterati.txt)"
          if bun ./strumenti/mac/esiti-dell-uscita.ts ../uscita/uscita-mac/esiti-alterati.txt; then echo "ROSSO: un esito alterato non è stato visto"; exit 1; fi
          echo "VERDE: l'uscita e i menu come attesi, e un esito alterato è rosso"

      # Una misura, non una prova: che cosa mostra il sistema quando l'app chiede di stampare.
      - name: Misura della stampa
        if: "!cancelled()"
        run: bash app/strumenti/mac/misura-stampa.sh "${APP_DI_PROVA}" "$PWD/uscita/stampa-mac"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: macos
          path: uscita/
          if-no-files-found: error
          retention-days: 7

  nucleo-macos:
    if: inputs.prove && contains(inputs.piattaforme || 'windows', 'macos')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Rust e Bun
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Dipendenze e interfaccia
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build

      # Una misura, non una prova: come si comporta il disco dove corre `cargo test`.
      - name: Il disco del Mac
        run: |
          mkdir -p uscita-nucleo
          d=$(mktemp -d)
          {
            diskutil info / | grep -E "File System Personality|Volume Name"
            touch "$d/Aa"; if [ -e "$d/aA" ]; then echo "maiuscole: non distinte"; else echo "maiuscole: distinte"; fi
            composta=$(printf 'caff\303\250'); scomposta=$(printf 'caffe\314\200')
            touch "$d/$composta"; if [ -e "$d/$scomposta" ]; then echo "forme Unicode: la stessa"; else echo "forme Unicode: due file"; fi
            echo "byte del nome letto: $(ls "$d" | grep caff | od -An -tx1 | tr -d '\n')"
            lungo=$(printf 'a%.0s' $(seq 1 255)); touch "$d/$lungo" && echo "nome di 255 caratteri: scritto"
            piu=$(printf 'a%.0s' $(seq 1 256)); touch "$d/$piu" 2>/dev/null && echo "nome di 256 caratteri: scritto" || echo "nome di 256 caratteri: rifiutato"
            larghi=$(printf '\303\250%.0s' $(seq 1 255)); touch "$d/$larghi" 2>/dev/null && echo "nome di 255 lettere accentate: scritto" || echo "nome di 255 lettere accentate: rifiutato"
          } | tee uscita-nucleo/disco.txt

      - name: Prove del guscio su APFS
        working-directory: app/shell
        run: cargo test 2>&1 | tee ../../uscita-nucleo/cargo-test.log; exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Prove del nucleo e dell'interfaccia
        if: "!cancelled()"
        working-directory: app
        run: bun test 2>&1 | tee ../uscita-nucleo/bun-test.log; exit "${PIPESTATUS[0]}"
        shell: bash

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nucleo-macos
          path: uscita-nucleo/
          retention-days: 7

  webkit-macos:
    if: inputs.prove && inputs.webkit_del_mac && contains(inputs.piattaforme || 'windows', 'macos')
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Bun
        working-directory: .
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Dipendenze e WebKit di Playwright
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright install webkit

      - name: Prove dell'interfaccia in WebKit
        run: bun ./strumenti/webkit.ts --progetto webkit-anteprima --processi 1

      # Una misura, non una prova: il canvas più grande che questo motore disegna e da cui dà il PNG.
      - name: Misura del canvas in WebKit
        if: "!cancelled()"
        run: set -o pipefail; bun ./strumenti/misura-del-canvas.ts --motore webkit | tee .collaudo/webkit-canvas.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: webkit-macos
          # `.collaudo` comincia col punto: senza questa riga il caricamento salta i suoi file (misurato).
          include-hidden-files: true
          path: |
            app/.collaudo/webkit-*
            app/.collaudo/playwright/
          retention-days: 7

  webkit-linux:
    if: inputs.prove && contains(inputs.piattaforme || 'windows', 'linux')
    runs-on: ubuntu-24.04
    # Con un processo solo le prove durano circa il doppio che con due.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Bun
        working-directory: .
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Dipendenze e WebKit di Playwright
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps webkit
          # Le misure delle prove che dipendono dal carattere (le righe della barra) sono quelle di DejaVu Sans.
          echo "carattere di sistema: $(fc-match system-ui)"

      # Un processo solo: con due, sui due processori della macchina, le prove di tempo e di trascinamento uscivano rosse
      # a intermittenza (una diversa ogni volta).
      - name: Prove dell'interfaccia in WebKit
        run: bun ./strumenti/webkit.ts --progetto webkit-anteprima --processi 1

      # Una misura, non una prova: il canvas più grande che questo motore disegna e da cui dà il PNG.
      - name: Misura del canvas in WebKit
        if: "!cancelled()"
        run: set -o pipefail; bun ./strumenti/misura-del-canvas.ts --motore webkit | tee .collaudo/webkit-canvas.log

      # Le righe della barra su Linux sono misurate nel WebKit; qui le stesse prove in Chromium per Linux, sul build che
      # `webkit.ts` ha appena fatto e col carattere di questa macchina. Il log va nell'artefatto; l'uscita di Playwright in
      # una cartella sua, perché la corsa svuota la propria e quella del WebKit si perderebbe.
      - name: Righe della barra in Chromium per Linux
        if: "!cancelled()"
        run: |
          set -o pipefail
          ./node_modules/.bin/playwright install --with-deps chromium
          bun --bun playwright test e2e/barra.e2e.ts --project=chromium-anteprima --workers 1 --retries 0 --reporter=line --output .collaudo/playwright-barra-chromium | tee .collaudo/webkit-barra-chromium.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: webkit-linux
          # `.collaudo` comincia col punto: senza questa riga il caricamento salta i suoi file (misurato).
          include-hidden-files: true
          path: |
            app/.collaudo/webkit-*
            app/.collaudo/playwright/
          retention-days: 7

  prodotto-linux:
    if: inputs.prove && contains(inputs.piattaforme || 'windows', 'linux')
    needs: linux
    # La macchina della build: il WebKitWebDriver di Ubuntu 22.04 è della stessa versione del WebKitGTK nell'AppImage.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Schermo virtuale, pilota di WebKitGTK, fotografie e lingue del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb imagemagick x11-utils locales
          sudo locale-gen it_IT.UTF-8 en_US.UTF-8

      - name: Rust, tauri-driver e Bun
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo install tauri-driver --version 2.1.0 --locked
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v5
        with:
          name: linux
          path: archivio

      - name: Dipendenze
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Prova sul prodotto
        working-directory: app
        run: bun ./strumenti/linux/prova-ci.ts --archivio "../archivio/AlgoDesign-$(jq -r .version package.json)-linux-x64.tar.gz" --uscita ../uscita-prodotto

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: prodotto-linux
          path: uscita-prodotto/
          retention-days: 7

  differenziale-linux:
    if: inputs.prove && contains(inputs.piattaforme || 'windows', 'linux')
    # Il gcc 13 e il clang di Ubuntu 24.04: l'avviso della ricorsione infinita c'è dal gcc 12.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Bun
        working-directory: .
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Dipendenze e compilatori
        run: |
          bun install --frozen-lockfile
          gcc --version | head -1
          clang --version | head -1
          python3 --version

      # Solo il percorso: il Python del servizio resta quello del PATH per il primo giro.
      - uses: actions/setup-python@v5
        id: python311
        with:
          python-version: "3.11"
          update-environment: false

      - name: Test differenziale
        run: |
          mkdir -p ../uscita-differenziale
          bun run differenziale > ../uscita-differenziale/differenziale.log 2>&1 && codice=0 || codice=$?
          tail -40 ../uscita-differenziale/differenziale.log
          echo "exit ${codice}"
          exit "${codice}"

      # Anche dopo un rosso del primo giro: i due esiti si leggono insieme. La riga della toolchain dice quale Python ha corso.
      - name: Test differenziale col Python 3.11
        if: "!cancelled()"
        env:
          ALGODESIGN_PYTHON: ${{ steps.python311.outputs.python-path }}
        run: |
          mkdir -p ../uscita-differenziale
          bun run differenziale > ../uscita-differenziale/differenziale-python-3.11.log 2>&1 && codice=0 || codice=$?
          tail -40 ../uscita-differenziale/differenziale-python-3.11.log
          echo "exit ${codice}"
          grep -q "Python da variabile ALGODESIGN_PYTHON: python 3\.11\." ../uscita-differenziale/differenziale-python-3.11.log || { echo "ROSSO: questo giro non ha corso col Python 3.11"; exit 1; }
          exit "${codice}"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: differenziale-linux
          path: uscita-differenziale/
          retention-days: 7
